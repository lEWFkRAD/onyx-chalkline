name: Connected classroom

on:
  push:
    paths: ['classroom/**', '.github/workflows/classroom.yml']
  pull_request:
    paths: ['classroom/**', '.github/workflows/classroom.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classroom
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: classroom/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm test --workspaces=false
      - run: npx --workspaces=false playwright install --with-deps chromium
      - run: npm run test:browser --workspaces=false
